<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活動記帳系統-全平台相容版</title>
    <!-- 引用 Excel 處理庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --p: #4a90e2; --s: #27ae60; --d: #e74c3c; --bg: #f8f9fa; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 15px; background: var(--bg); }
        .container { max-width: 550px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: border 0.3s; }
        input:focus { border-color: var(--p); outline: none; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        button { padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: opacity 0.2s; }
        .btn-add { background: var(--p); grid-column: span 2; }
        .btn-export { background: var(--s); }
        .btn-import { background: #f39c12; }
        .btn-clear { background: #95a5a6; width: 100%; margin-top: 15px; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 25px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 350px; }
        th, td { padding: 14px 10px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 15px; }
        th { background: #fcfcfc; color: #888; font-weight: 500; }
        .total-section { margin-top: 20px; text-align: right; font-size: 1.4rem; font-weight: bold; color: var(--d); border-top: 2px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>活動記帳系統</h2>
    
    <div class="form-group">
        <label>活動名稱</label>
        <input type="text" id="activityName" placeholder="輸入活動名稱" oninput="localStorage.setItem('current_activity_name', this.value)">
    </div>
    <div class="form-group"><label>日期</label><input type="date" id="date"></div>
    <div class="form-group"><label>項目</label><input type="text" id="item" placeholder="例如：車資"></div>
    <div class="form-group"><label>金額</label><input type="number" id="amount" inputmode="decimal" placeholder="輸入金額"></div>

    <div class="btn-group">
        <button type="button" class="btn-add" onclick="doAdd()">新增紀錄</button>
        <button type="button" class="btn-export" onclick="doExport()">匯出 Excel</button>
        <button type="button" class="btn-import" onclick="document.getElementById('importFile').click()">匯入 Excel</button>
        <input type="file" id="importFile" style="display:none" accept=".xlsx, .xls" onchange="handleImport(this)">
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>日期</th><th>項目</th><th>金額</th><th>操作</th></tr></thead>
            <tbody id="recordBody"></tbody>
        </table>
    </div>
