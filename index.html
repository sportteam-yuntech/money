<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 關鍵：防止手機縮放導致 UI 跑版，並優化 Web App 顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>活動記帳系統 Pro Mobile V3</title>
    
    <!-- 載入 Excel 處理庫 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --primary-color: #4a90e2; 
            --success-color: #27ae60; 
            --danger-color: #e74c3c;
            --bg-color: #f0f2f5; 
        }
        
        body { 
            font-family: "Microsoft JhengHei", -apple-system, sans-serif; 
            margin: 0; padding: 15px; background: var(--bg-color); 
            -webkit-tap-highlight-color: transparent;
        }
        
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #333; margin: 0 0 20px 0; font-size: 1.4rem; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 0.9rem; }
        
        /* 加大輸入框與防止 iOS 自動縮放 (16px) */
        input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; background: #fff;
        }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { 
            flex: 1; padding: 14px; border: none; border-radius: 8px; 
            font-size: 16px; font-weight: bold; cursor: pointer; color: white;
        }
        .btn-add { background: var(--primary-color); flex: 2; }
        .btn-export { background: var(--success-color); }
        .btn-clear { background: #95a5a6; }
        button:active { opacity: 0.8; transform: scale(0.98); }
